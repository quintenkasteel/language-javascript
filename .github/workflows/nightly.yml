name: Nightly Tests

on:
  schedule:
    # Run every night at 1 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      run_fuzzing:
        description: 'Run extended fuzzing tests'
        required: false
        default: 'true'
        type: boolean
      run_performance:
        description: 'Run performance benchmarks'
        required: false
        default: 'true'
        type: boolean

env:
  CABAL_NO_SANDBOX: 1

jobs:
  # Job 1: Extended fuzzing tests
  fuzzing:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.run_fuzzing != 'false'
    timeout-minutes: 120
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.8.2'
        cabal-version: 'latest'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: nightly-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}

    - name: Generate lexer and parser
      run: |
        cabal build --dependencies-only --enable-tests
        cabal exec alex -- src/Language/JavaScript/Parser/Lexer.x
        cabal exec happy -- src/Language/JavaScript/Parser/Grammar7.y

    - name: Build with fuzzing enabled
      run: |
        cabal build --enable-tests
        
    - name: Run extended fuzzing tests
      run: |
        echo "Running extended fuzzing tests for 2 hours..."
        export FUZZ_TEST_ENV=nightly
        export FUZZ_DURATION_MINUTES=120
        timeout 7200s cabal test testsuite --test-options="--pattern=Fuzz" || echo "Fuzzing completed"

    - name: Generate random JavaScript samples
      run: |
        echo "Generating random JavaScript for parser testing..."
        mkdir -p fuzz-samples
        
        # Generate various JavaScript patterns
        python3 -c "
        import random
        import string
        
        def random_identifier():
            return ''.join(random.choices(string.ascii_letters, k=random.randint(1, 10)))
        
        def random_number():
            return str(random.randint(0, 1000000))
        
        def random_string():
            return '\"' + ''.join(random.choices(string.printable.replace('\"', ''), k=random.randint(0, 50))) + '\"'
        
        # Generate test cases
        for i in range(1000):
            with open(f'fuzz-samples/test_{i}.js', 'w') as f:
                # Random variable declarations
                for _ in range(random.randint(1, 10)):
                    f.write(f'var {random_identifier()} = {random.choice([random_number(), random_string(), \"true\", \"false\", \"null\"])};\\n')
                
                # Random function declarations  
                for _ in range(random.randint(0, 5)):
                    f.write(f'function {random_identifier()}() {{ return {random_number()}; }}\\n')
        "

    - name: Test parser with fuzz samples
      run: |
        echo "Testing parser with generated samples..."
        FAILED_COUNT=0
        TOTAL_COUNT=0
        
        for file in fuzz-samples/*.js; do
          TOTAL_COUNT=$((TOTAL_COUNT + 1))
          if ! timeout 5s cabal exec language-javascript < "$file" > /dev/null 2>&1; then
            FAILED_COUNT=$((FAILED_COUNT + 1))
          fi
          
          if [ $((TOTAL_COUNT % 100)) -eq 0 ]; then
            echo "Processed $TOTAL_COUNT files, $FAILED_COUNT failures"
          fi
        done
        
        echo "::notice::Fuzz testing completed: $FAILED_COUNT failures out of $TOTAL_COUNT tests"
        
        # Upload failing samples for analysis
        if [ $FAILED_COUNT -gt 0 ]; then
          echo "Collecting failed samples..."
          mkdir -p failed-samples
          cp fuzz-samples/test_*.js failed-samples/ 2>/dev/null || true
        fi

    - name: Upload fuzz results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-results
        path: |
          failed-samples/
          fuzz-samples/test_*.js

  # Job 2: Performance benchmarking and regression detection
  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event.inputs.run_performance != 'false'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.8.2'
        cabal-version: 'latest'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: perf-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}

    - name: Generate lexer and parser
      run: |
        cabal build --dependencies-only --enable-benchmarks
        cabal exec alex -- src/Language/JavaScript/Parser/Lexer.x
        cabal exec happy -- src/Language/JavaScript/Parser/Grammar7.y

    - name: Build optimized version
      run: |
        cabal configure --enable-optimization=2 --enable-benchmarks
        cabal build

    - name: Download large JavaScript files for testing
      run: |
        mkdir -p perf-test-files
        echo "Downloading real-world JavaScript files..."
        
        # jQuery
        curl -o perf-test-files/jquery.js https://code.jquery.com/jquery-3.7.1.js
        
        # Lodash
        curl -o perf-test-files/lodash.js https://cdn.jsdelivr.net/npm/lodash@4/lodash.js
        
        # React
        curl -o perf-test-files/react.js https://unpkg.com/react@18/umd/react.development.js
        
        # Angular
        curl -o perf-test-files/angular.js https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.js
        
        # Vue.js
        curl -o perf-test-files/vue.js https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js

    - name: Run performance benchmarks
      run: |
        echo "Running Criterion benchmarks..."
        cabal bench --benchmark-options='+RTS -T -RTS --output benchmark-results.html --json benchmark-results.json'

    - name: Test parsing performance on real files
      run: |
        echo "Testing parsing performance on real JavaScript files..."
        echo "# Performance Results" > performance-report.md
        echo "" >> performance-report.md
        echo "| File | Size | Parse Time | Memory Usage |" >> performance-report.md
        echo "|------|------|------------|--------------|" >> performance-report.md
        
        for file in perf-test-files/*.js; do
          filename=$(basename "$file")
          filesize=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null || echo "unknown")
          
          echo "Testing $filename..."
          
          # Measure parsing time and memory
          /usr/bin/time -f "%e seconds, %M KB max memory" timeout 30s cabal exec language-javascript < "$file" > /dev/null 2> time_output.txt || echo "timeout/error" > time_output.txt
          
          time_info=$(cat time_output.txt)
          echo "| $filename | $filesize bytes | $time_info |" >> performance-report.md
        done

    - name: Compare with baseline performance
      run: |
        echo "Comparing with baseline performance..."
        # This would compare with stored baseline results
        if [ -f benchmark-results.json ]; then
          echo "Current benchmark results available for comparison"
          
          # Simple regression check - fail if any benchmark is 20% slower
          python3 -c "
          import json
          import sys
          
          try:
              with open('benchmark-results.json', 'r') as f:
                  data = json.load(f)
                  print('Benchmark results loaded successfully')
                  
              # Here we would compare with baseline results
              # For now, just report that results are available
              print('::notice::Performance benchmarks completed successfully')
              
          except Exception as e:
              print(f'Error processing benchmark results: {e}')
              sys.exit(1)
          "
        fi

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          benchmark-results.html
          benchmark-results.json
          performance-report.md
          time_output.txt

  # Job 3: Memory leak detection
  memory-analysis:
    name: Memory Analysis
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.8.2'
        cabal-version: 'latest'

    - name: Install memory analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind

    - name: Generate lexer and parser
      run: |
        cabal build --dependencies-only
        cabal exec alex -- src/Language/JavaScript/Parser/Lexer.x
        cabal exec happy -- src/Language/JavaScript/Parser/Grammar7.y

    - name: Build with profiling
      run: |
        cabal configure --enable-profiling --ghc-options="-fprof-auto -rtsopts"
        cabal build

    - name: Run memory leak detection
      run: |
        echo "Running memory leak detection..."
        
        # Create test input
        echo "var x = 42; function test() { return x + 1; }" > test-input.js
        
        # Run with heap profiling
        cabal exec language-javascript -- +RTS -hc -p -RTS < test-input.js || echo "Profiling completed"
        
        # Run with Valgrind (if executable exists)
        EXEC_PATH=$(find dist-newstyle -name "language-javascript" -type f -executable | head -1)
        if [ -n "$EXEC_PATH" ]; then
          echo "Running Valgrind analysis..."
          echo "var x = 42;" | timeout 60s valgrind --leak-check=full --show-leak-kinds=all "$EXEC_PATH" || echo "Valgrind completed"
        fi

    - name: Analyze heap usage
      run: |
        if [ -f language-javascript.hp ]; then
          echo "Heap profile generated"
          # Convert to PostScript for analysis
          hp2ps -c language-javascript.hp || echo "hp2ps conversion completed"
        fi

    - name: Upload memory analysis
      uses: actions/upload-artifact@v4
      with:
        name: memory-analysis
        path: |
          language-javascript.hp
          language-javascript.ps
          language-javascript.prof

  # Job 4: Compatibility testing across GHC versions
  compatibility:
    name: GHC Compatibility Matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        ghc: ['8.10.7', '9.0.2', '9.2.8', '9.4.8', '9.6.4', '9.8.2']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    - name: Test build
      run: |
        cabal update
        cabal build --dependencies-only || echo "Dependencies build completed"
        
        # Generate lexer and parser
        cabal exec alex -- src/Language/JavaScript/Parser/Lexer.x || echo "Alex completed"
        cabal exec happy -- src/Language/JavaScript/Parser/Grammar7.y || echo "Happy completed"
        
        cabal build || echo "Build completed"

    - name: Quick test
      run: |
        echo 'var test = "hello world";' | cabal exec language-javascript || echo "Test completed"

  # Job 5: Nightly report generation
  nightly-report:
    name: Generate Nightly Report
    runs-on: ubuntu-latest
    needs: [fuzzing, performance, memory-analysis, compatibility]
    if: always()
    steps:
    - name: Generate comprehensive report
      run: |
        echo "# Nightly Test Report - $(date -u)" > nightly-report.md
        echo "" >> nightly-report.md
        echo "## Test Results Summary" >> nightly-report.md
        echo "" >> nightly-report.md
        echo "| Component | Status | Duration |" >> nightly-report.md
        echo "|-----------|--------|----------|" >> nightly-report.md
        echo "| Fuzzing Tests | ${{ needs.fuzzing.result }} | $(echo '${{ needs.fuzzing.outputs.duration }}' || echo 'N/A') |" >> nightly-report.md
        echo "| Performance | ${{ needs.performance.result }} | $(echo '${{ needs.performance.outputs.duration }}' || echo 'N/A') |" >> nightly-report.md
        echo "| Memory Analysis | ${{ needs.memory-analysis.result }} | $(echo '${{ needs.memory-analysis.outputs.duration }}' || echo 'N/A') |" >> nightly-report.md
        echo "| Compatibility | ${{ needs.compatibility.result }} | $(echo '${{ needs.compatibility.outputs.duration }}' || echo 'N/A') |" >> nightly-report.md
        echo "" >> nightly-report.md
        
        # Overall health status
        if [ "${{ needs.fuzzing.result }}" = "success" ] && \
           [ "${{ needs.performance.result }}" = "success" ] && \
           [ "${{ needs.memory-analysis.result }}" = "success" ] && \
           [ "${{ needs.compatibility.result }}" = "success" ]; then
          echo "## 🟢 Overall Status: HEALTHY" >> nightly-report.md
        else
          echo "## 🟡 Overall Status: NEEDS ATTENTION" >> nightly-report.md
        fi
        
        echo "" >> nightly-report.md
        echo "Generated at: $(date -u)" >> nightly-report.md
        echo "Commit: $GITHUB_SHA" >> nightly-report.md

    - name: Upload nightly report
      uses: actions/upload-artifact@v4
      with:
        name: nightly-report
        path: nightly-report.md

    - name: Create issue for failures (if any)
      if: needs.fuzzing.result == 'failure' || needs.performance.result == 'failure' || needs.memory-analysis.result == 'failure' || needs.compatibility.result == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('nightly-report.md', 'utf8');
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `Nightly Test Failures - ${new Date().toISOString().split('T')[0]}`,
            body: `Automated nightly tests have detected failures:\n\n${report}`,
            labels: ['bug', 'ci-failure', 'nightly-tests']
          });