name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.8.0.0)'
        required: true
        type: string

env:
  CABAL_NO_SANDBOX: 1

jobs:
  # Job 1: Create release builds for multiple platforms
  build-release:
    name: Build Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: linux-x64
          - os: macos-latest  
            artifact-name: macos-x64
          - os: windows-latest
            artifact-name: windows-x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.8.2'
        cabal-version: 'latest'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cabal/packages
          ~/.cabal/store
          dist-newstyle
        key: release-${{ runner.os }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}

    - name: Generate lexer and parser
      run: |
        cabal build --dependencies-only
        cabal exec alex -- src/Language/JavaScript/Parser/Lexer.x
        cabal exec happy -- src/Language/JavaScript/Parser/Grammar7.y

    - name: Build optimized release
      run: |
        cabal configure --enable-optimization=2 --enable-split-sections --enable-executable-stripping
        cabal build exe:language-javascript

    - name: Create release package
      shell: bash
      run: |
        mkdir -p release-package
        
        # Copy executable
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          cp dist-newstyle/build/*/ghc-*/language-javascript-*/x/language-javascript/build/language-javascript/language-javascript.exe release-package/
        else
          cp dist-newstyle/build/*/ghc-*/language-javascript-*/x/language-javascript/build/language-javascript/language-javascript release-package/
        fi
        
        # Copy documentation
        cp README.md release-package/
        cp ChangeLog.md release-package/
        cp LICENSE release-package/
        
        # Create archive
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          7z a language-javascript-${{ matrix.artifact-name }}.zip release-package/*
        else
          tar czf language-javascript-${{ matrix.artifact-name }}.tar.gz -C release-package .
        fi

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: language-javascript-${{ matrix.artifact-name }}
        path: language-javascript-${{ matrix.artifact-name }}.*

  # Job 2: Create source distribution and validate
  source-dist:
    name: Source Distribution
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.8.2'
        cabal-version: 'latest'

    - name: Generate lexer and parser
      run: |
        cabal build --dependencies-only
        cabal exec alex -- src/Language/JavaScript/Parser/Lexer.x
        cabal exec happy -- src/Language/JavaScript/Parser/Grammar7.y

    - name: Create and validate source distribution
      run: |
        cabal check
        cabal sdist
        
        # Test that the source distribution builds
        cd dist-newstyle/sdist/
        tar xzf *.tar.gz
        cd language-javascript-*/
        cabal build
        cabal test

    - name: Upload source distribution
      uses: actions/upload-artifact@v4
      with:
        name: language-javascript-source
        path: dist-newstyle/sdist/*.tar.gz

  # Job 3: Generate comprehensive documentation
  documentation:
    name: Release Documentation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.8.2'
        cabal-version: 'latest'

    - name: Generate lexer and parser
      run: |
        cabal build --dependencies-only
        cabal exec alex -- src/Language/JavaScript/Parser/Lexer.x
        cabal exec happy -- src/Language/JavaScript/Parser/Grammar7.y

    - name: Build documentation
      run: |
        cabal haddock --enable-doc-index --hyperlink-source --haddock-all
        
        # Create documentation package
        mkdir -p release-docs
        find dist-newstyle -name "*.html" -path "*/doc/html/*" -exec cp -r {} release-docs/ \; || true
        
        # Add README and changelog to docs
        cp README.md release-docs/
        cp ChangeLog.md release-docs/
        
        tar czf language-javascript-docs.tar.gz -C release-docs .

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: language-javascript-documentation
        path: language-javascript-docs.tar.gz

  # Job 4: Run comprehensive test suite for release
  release-tests:
    name: Release Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ghc: ['9.6.4', '9.8.2']
      fail-fast: true  # Fail fast for release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: 'latest'

    - name: Generate lexer and parser
      run: |
        cabal build --dependencies-only --enable-tests --enable-benchmarks
        cabal exec alex -- src/Language/JavaScript/Parser/Lexer.x
        cabal exec happy -- src/Language/JavaScript/Parser/Grammar7.y

    - name: Run full test suite
      run: |
        cabal test --enable-tests --test-show-details=streaming
        
    - name: Run benchmarks
      if: matrix.os == 'ubuntu-latest' && matrix.ghc == '9.8.2'
      run: cabal bench

  # Job 5: Create GitHub release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release, source-dist, documentation, release-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create release notes
      run: |
        echo "# Release v${{ steps.version.outputs.VERSION }}" > release-notes.md
        echo "" >> release-notes.md
        
        # Extract relevant changelog section
        awk '/^## ${{ steps.version.outputs.VERSION }}/{flag=1} flag && /^## [0-9]/ && !/^## ${{ steps.version.outputs.VERSION }}/{flag=0} flag' ChangeLog.md >> release-notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release v${{ steps.version.outputs.VERSION }}
        body_path: release-notes.md
        draft: false
        prerelease: false
        files: |
          artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 6: Publish to Hackage (optional, requires HACKAGE_TOKEN secret)
  publish-hackage:
    name: Publish to Hackage
    runs-on: ubuntu-latest
    needs: [create-release]
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease
    environment: hackage  # Requires manual approval
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.8.2'
        cabal-version: 'latest'

    - name: Generate lexer and parser
      run: |
        cabal build --dependencies-only
        cabal exec alex -- src/Language/JavaScript/Parser/Lexer.x
        cabal exec happy -- src/Language/JavaScript/Parser/Grammar7.y

    - name: Build and check package
      run: |
        cabal check
        cabal sdist

    - name: Upload to Hackage
      if: env.HACKAGE_TOKEN != ''
      run: |
        cabal upload --publish dist-newstyle/sdist/*.tar.gz
      env:
        HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}

    - name: Upload documentation to Hackage
      if: env.HACKAGE_TOKEN != ''
      run: |
        cabal upload --documentation dist-newstyle/sdist/*.tar.gz
      env:
        HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}